name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build Monitor de Pátio APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-dev \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            ant

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cython==0.29.36 buildozer

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v7-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v7-${{ runner.os }}-

      - name: Setup Android SDK Tools and Licenses
        run: |
          ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip -d temp_tools
            rm -rf "$ANDROID_HOME/cmdline-tools/latest/"*
            mv temp_tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
            rm -rf cmdline-tools.zip temp_tools
          fi

          mkdir -p "$ANDROID_HOME/tools"
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/tools/bin"
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest/lib" "$ANDROID_HOME/tools/lib"

          mkdir -p "$ANDROID_HOME/licenses"
          printf "d56f5187479451eabf01fb78af6dfcb139a648b0\n84831b5859ab4911178640195629415afe749d23\n24333f8a63b6825ea9c5514f83c2829b004d1fb8\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b5859ab4911178640195629415afe749d23\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Build APK
        shell: bash
        run: |
          constraints="$RUNNER_TEMP/android-pip-constraints.txt"

          # Restrições usadas na resolução e na instalação das dependências.
          cat > "$constraints" <<'EOF'
          pip==25.3
          charset-normalizer @ https://files.pythonhosted.org/packages/fc/ad/d07d7862a62ffa6d79d68074d14823243dd235a77c45262acbf6adeb28bf/charset_normalizer-3.5.2-py3-none-any.whl
          EOF

          export PIP_CONSTRAINT="$constraints"
          python -m pip config --user set install.constraint "$constraints"

          for venv in .buildozer/android/platform/build-*/build/venv; do
            if [ -d "$venv" ]; then
              rm -rf -- "$venv"
            fi
          done

          mkdir -p collected_logs
          log="collected_logs/buildozer-completo.log"
          matches="$RUNNER_TEMP/buildozer-erros.txt"
          pattern='ImportError:|ModuleNotFoundError:|fatal error:|(^|[[:space:]])error:|No space left on device|BUILD FAILED|FAILURE: Build failed|Killed'

          echo "Compilando com pip 25.3 e charset-normalizer 3.5.2 universal."
          if buildozer -v android debug > "$log" 2>&1; then
            echo "Buildozer concluiu a criação do APK."
          else
            status=$?
            echo "::error title=Falha ao criar APK::Buildozer saiu com código $status. Veja o Resumo da execução."

            {
              echo "## ❌ Falha ao criar APK"
              echo
              echo "O Buildozer terminou com código $status."
              echo
              echo "### Mensagens de erro encontradas"
              echo
              if grep -aEin "$pattern" "$log" > "$matches"; then
                tail -n 20 "$matches" | cut -c 1-500 | sed 's/^/    /'
              else
                echo "Veja as últimas linhas e o log completo abaixo."
              fi
              echo
              echo "### Últimas 30 linhas do log"
              echo
              tail -n 30 "$log" | cut -c 1-500 | sed 's/^/    /'
              echo
              echo "Arquivo completo: Monitor-de-Patio-Build-Logs / buildozer-completo.log"
            } >> "$GITHUB_STEP_SUMMARY"

            exit "$status"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Monitor-de-Patio-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Collect build logs
        if: failure()
        run: |
          mkdir -p collected_logs
          find . "$HOME/.buildozer" \
            -path './collected_logs' -prune -o \
            -type f -name '*.log' \
            -exec cp --parents {} collected_logs/ \; \
            2>/dev/null || true

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Monitor-de-Patio-Build-Logs
          path: collected_logs/
          if-no-files-found: warn
