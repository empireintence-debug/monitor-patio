      - name: Setup Android SDK Command-line Tools
        run: |
          ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          rm -rf $ANDROID_HOME/cmdline-tools
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d temp_tools
          mv temp_tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          rm -rf cmdline-tools.zip temp_tools
          if [ ! -L "$ANDROID_HOME/tools" ]; then
            ln -s $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools
          fi
