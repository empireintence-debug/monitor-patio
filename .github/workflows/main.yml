name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build Monitor de Pátio APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # Baixar o projeto
      - name: Checkout
        uses: actions/checkout@v4

      # Preparar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Instalar dependências do Linux
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-dev \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            ant

      # Instalar Buildozer e Cython
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.36 buildozer

      # Armazenar SDK, NDK e arquivos de compilação
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v5-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v5-${{ runner.os }}-

      # Compilar o APK
      - name: Build APK
        run: |
          buildozer -v android debug

      # Disponibilizar o APK para download
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Monitor-de-Patio-APK
          path: bin/*.apk
          if-no-files-found: error

      # Recolher registros se houver erro
      - name: Collect build logs
        if: failure()
        run: |
          mkdir -p collected_logs
          find .buildozer "$HOME/.buildozer" \
            -type f -name "*.log" \
            -exec cp --parents {} collected_logs/ \; \
            2>/dev/null || true

      # Disponibilizar registros para análise
      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Monitor-de-Patio-Build-Logs
          path: collected_logs/
          if-no-files-found: warn
