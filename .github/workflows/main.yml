      - name: Cache Buildozer Directory
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('.github/workflows/main.yml') }}
          restore-keys: |
            buildozer-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-
            buildozer-v3-${{ runner.os }}-
